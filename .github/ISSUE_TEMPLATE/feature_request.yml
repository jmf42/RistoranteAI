name: Feature request
description: Propose a product or operational improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user, operator, or business problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful version.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Backend
        - Dashboard
        - Twilio voice
        - OpenAI Realtime
        - Reservations
        - Database
        - Deployment
        - Documentation
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will we know this is finished?
      placeholder: |
        - ...
        - ...
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Production risk or rollout notes
      description: Mention migrations, secrets, billing, live calls, or customer data if relevant.
    validations:
      required: false
